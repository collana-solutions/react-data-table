name: Build and Deploy Storybook

# Publishes the Storybook of every release to the gh-pages branch, which GitHub Pages serves
# at the package homepage (https://collana-solutions.github.io/react-data-table).
on:
  release:
    types: [released]

permissions: {}

jobs:
  build-storybook:
    name: Build and deploy Storybook
    runs-on: ubuntu-latest
    permissions:
      # Pushes the built Storybook to the gh-pages branch.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Release jobs never restore a cache that a pull request run could have written.
          package-manager-cache: false

      # Activates the pnpm version pinned in the root manifest packageManager field.
      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm run build-storybook

      # gh-pages clones and pushes the URL given with --repo, so the token is passed
      # explicitly and never stored in the git config of the checkout. --silent keeps that
      # URL out of the log.
      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          pnpm exec gh-pages
          --dist storybook-static
          --repo "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          --user "github-actions-bot <support+actions@github.com>"
          --silent
